<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>StoreDesk — Add Product</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Drawer overlay + drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-logo">🛒 StoreDesk</span>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-nav">
      <a href="list.html"   class="drawer-link"><span class="link-icon">🏠</span> Counter</a>
      <a href="admin.html"  class="drawer-link active"><span class="link-icon">➕</span> Add Product</a>
      <a href="update.html" class="drawer-link"><span class="link-icon">✏️</span> Update Price</a>
      <div class="drawer-divider"></div>
      <button class="drawer-link danger" id="logoutBtn"><span class="link-icon">🚪</span> Logout</button>
    </div>
  </nav>

  <header class="app-bar">
    <div class="logo">🛒 <span>StoreDesk</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="page-wrapper">
    <div class="admin-header container">
      <h2>Add Product</h2>
      <p>Fill in the bulk purchase details to add a new inventory item.</p>
    </div>
    <div class="admin-form-card">
      <div class="section-divider"><span>Product Identity</span></div>
      <div class="form-group">
        <label for="productName">Product Name *</label>
        <input type="text" id="productName" placeholder="e.g. Sunflower Oil" />
      </div>
      <div class="section-divider"><span>Bulk Purchase</span></div>
      <div class="form-row">
        <div class="form-group">
          <label for="buyPriceBulk">Bulk Buy Price (৳) *</label>
          <input type="number" id="buyPriceBulk" placeholder="e.g. 1200" min="0" step="0.01" inputmode="decimal" />
        </div>
        <div class="form-group">
          <label for="bulkUnit">Bulk Unit Type *</label>
          <select id="bulkUnit">
            <option value="">Select…</option>
            <option value="Packet">Packet</option>
            <option value="Box">Box</option>
            <option value="Sack">Sack</option>
            <option value="Bag">Bag</option>
            <option value="Carton">Carton</option>
            <option value="Bundle">Bundle</option>
            <option value="Dozen">Dozen</option>
            <option value="Crate">Crate</option>
            <option value="Drum">Drum</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="piecesPerBulk">Pieces / Qty Inside *</label>
          <input type="number" id="piecesPerBulk" placeholder="e.g. 24" min="1" step="1" inputmode="numeric" />
        </div>
        <div class="form-group">
          <label for="unitType">Retail Unit Type *</label>
          <input type="text" id="unitType" placeholder="e.g. Pcs, KG, Ltr" />
        </div>
      </div>
      <div class="cost-preview" id="costPreview">
        <span class="label">Calculated Cost / Unit</span>
        <span class="value" id="costPerUnitDisplay">—</span>
      </div>
      <div class="section-divider"><span>Retail Pricing (Optional)</span></div>
      <div class="form-group">
        <label for="mrpPerUnit">MRP per Retail Unit (৳)</label>
        <input type="number" id="mrpPerUnit" placeholder="e.g. 60.00" min="0" step="0.01" inputmode="decimal" />
      </div>
      <div class="section-divider"><span>Product Image</span></div>
      <div class="image-preview-box" id="imagePreviewBox">
        <div class="placeholder"><div class="icon">📷</div><p>Image preview</p></div>
      </div>
      <div class="form-group">
        <label for="imageFile">Upload Image (JPG / PNG / WEBP)</label>
        <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp,image/gif" />
      </div>
      <div class="upload-progress" id="uploadProgress">
        <div class="upload-progress-bar" id="uploadProgressBar"></div>
      </div>
      <button class="btn btn-primary" id="submitBtn" style="margin-top:20px;">
        <span id="submitBtnText">💾 Save Product</span>
      </button>
    </div>
  </div>

  <script type="module">
    import { auth, db, uploadImageToGitHub } from "./app.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, user => { if (!user) window.location.href = "index.html"; });

    // Drawer
    const drawer  = document.getElementById("drawer");
    const overlay = document.getElementById("drawerOverlay");
    document.getElementById("menuBtn").addEventListener("click", () => { drawer.classList.add("open"); overlay.classList.add("open"); });
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth); sessionStorage.removeItem("gh_pat"); window.location.href = "index.html";
    });

    function showToast(message, type="info") {
      const c = document.getElementById("toastContainer");
      const icons = {success:"✅",error:"❌",info:"ℹ️"};
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.classList.add("dismissing"); t.addEventListener("animationend", () => t.remove(), {once:true}); }, 4000);
    }

    const buyPriceEl     = document.getElementById("buyPriceBulk");
    const piecesEl       = document.getElementById("piecesPerBulk");
    const costDisplay    = document.getElementById("costPerUnitDisplay");
    const imageFileEl    = document.getElementById("imageFile");
    const previewBox     = document.getElementById("imagePreviewBox");
    const submitBtn      = document.getElementById("submitBtn");
    const submitBtnText  = document.getElementById("submitBtnText");
    const progressBar    = document.getElementById("uploadProgress");
    const progressFill   = document.getElementById("uploadProgressBar");

    function updateCostPreview() {
      const price = parseFloat(buyPriceEl.value), pieces = parseFloat(piecesEl.value);
      costDisplay.textContent = (price > 0 && pieces > 0) ? `৳${(price/pieces).toFixed(2)}` : "—";
    }
    buyPriceEl.addEventListener("input", updateCostPreview);
    piecesEl.addEventListener("input", updateCostPreview);

    imageFileEl.addEventListener("change", () => {
      const file = imageFileEl.files[0];
      if (!file) return;
      previewBox.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="Preview" />`;
    });

    submitBtn.addEventListener("click", async () => {
      const name      = document.getElementById("productName").value.trim();
      const bulkPrice = parseFloat(buyPriceEl.value);
      const bulkUnit  = document.getElementById("bulkUnit").value.trim();
      const pieces    = parseFloat(piecesEl.value);
      const unitType  = document.getElementById("unitType").value.trim();
      const mrp       = parseFloat(document.getElementById("mrpPerUnit").value) || null;
      const imageFile = imageFileEl.files[0] || null;

      if (!name)              { showToast("Product name is required.", "error"); return; }
      if (!bulkPrice || bulkPrice <= 0) { showToast("Enter a valid bulk buy price.", "error"); return; }
      if (!bulkUnit)          { showToast("Select a bulk unit type.", "error"); return; }
      if (!pieces || pieces <= 0) { showToast("Enter pieces/quantity.", "error"); return; }
      if (!unitType)          { showToast("Enter a retail unit type.", "error"); return; }

      submitBtn.disabled = true; submitBtnText.textContent = "Uploading image…";
      progressBar.classList.add("active"); progressFill.style.width = "30%";
      let imageUrl = "";
      try {
        if (imageFile) { progressFill.style.width = "55%"; imageUrl = await uploadImageToGitHub(imageFile, imageFile.name); progressFill.style.width = "80%"; }
        submitBtnText.textContent = "Saving…"; progressFill.style.width = "90%";
        await addDoc(collection(db, "products"), {
          name, nameLower: name.toLowerCase(),
          buyPriceBulk: bulkPrice, bulkUnit, piecesPerBulk: pieces, unitType,
          buyPricePerUnit: parseFloat((bulkPrice/pieces).toFixed(4)),
          mrpPerUnit: mrp, imageUrl, lastUpdated: serverTimestamp()
        });
        progressFill.style.width = "100%";
        showToast(`"${name}" saved! ✨`, "success");
        setTimeout(() => {
          ["productName","buyPriceBulk","unitType","mrpPerUnit"].forEach(id => document.getElementById(id).value = "");
          document.getElementById("bulkUnit").value = ""; piecesEl.value = "";
          imageFileEl.value = ""; costDisplay.textContent = "—";
          previewBox.innerHTML = `<div class="placeholder"><div class="icon">📷</div><p>Image preview</p></div>`;
          progressBar.classList.remove("active"); progressFill.style.width = "0%";
          submitBtn.disabled = false; submitBtnText.textContent = "💾 Save Product";
        }, 800);
      } catch(err) {
        showToast(`Error: ${err.message}`, "error");
        submitBtn.disabled = false; submitBtnText.textContent = "💾 Save Product";
        progressBar.classList.remove("active"); progressFill.style.width = "0%";
      }
    });
  </script>
</body>
</html>
