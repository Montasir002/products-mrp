<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>StoreDesk — Update Price</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-logo">🛒 StoreDesk</span>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-nav">
      <a href="list.html"   class="drawer-link"><span class="link-icon">🏠</span> Counter</a>
      <a href="admin.html"  class="drawer-link"><span class="link-icon">➕</span> Add Product</a>
      <a href="update.html" class="drawer-link active"><span class="link-icon">✏️</span> Update Price</a>
      <div class="drawer-divider"></div>
      <button class="drawer-link danger" id="logoutBtn"><span class="link-icon">🚪</span> Logout</button>
    </div>
  </nav>

  <!-- App bar replaced by page headline -->
  <header class="app-bar">
    <div class="logo">✏️ <span>Update Price</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="search-bar-wrap">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Search products…" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search" />
    </div>
    
    <div class="sort-row">
      <button class="sort-toggle-btn" id="sortToggleBtn">A → Z</button>
      <button class="price-eye-btn" id="priceEyeBtn">👁</button>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <main class="product-grid" id="productGrid">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </main>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="btn btn-secondary load-more-btn" id="loadMoreBtn">Load More</button>
  </div>

  <!-- Edit Bottom Sheet -->
  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle-wrap" id="sheetHandleWrap">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-header">
      <span class="sheet-title" id="sheetTitle">Edit Product</span>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body">
      <input type="hidden" id="editId" />
      <div class="form-group">
        <label for="editName">Product Name</label>
        <input type="text" id="editName" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="editBulkPrice">Bulk Buy Price (৳)</label>
          <input type="number" id="editBulkPrice" min="0" step="0.01" inputmode="decimal" />
        </div>
        <div class="form-group">
          <label for="editPieces">Pieces / Qty</label>
          <input type="number" id="editPieces" min="1" step="1" inputmode="numeric" />
        </div>
      </div>
      <div class="cost-preview" style="margin-bottom:16px;">
        <span class="label">New Cost / Unit</span>
        <span class="value" id="editCostPreview">—</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="editBulkUnit">Bulk Unit</label>
          <select id="editBulkUnit">
            <option value="Packet">Packet</option>
            <option value="Box">Box</option>
            <option value="Sack">Sack</option>
            <option value="Bag">Bag</option>
            <option value="Carton">Carton</option>
            <option value="Bundle">Bundle</option>
            <option value="Dozen">Dozen</option>
            <option value="Crate">Crate</option>
            <option value="Drum">Drum</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editUnitType">Retail Unit</label>
          <input type="text" id="editUnitType" placeholder="Pcs, KG, Ltr…" />
        </div>
      </div>
      <div class="form-group">
        <label for="editMrp">MRP per Unit (৳)</label>
        <input type="number" id="editMrp" min="0" step="0.01" inputmode="decimal" placeholder="Optional" />
      </div>
      <div class="section-divider"><span>Product Image</span></div>
      <div class="image-preview-box" id="editImagePreview">
        <div class="placeholder"><div class="icon">📷</div><p>Current image</p></div>
      </div>
      <div class="form-group" style="margin-top:10px;">
        <label for="editImageFile">Replace Image (optional)</label>
        <input type="file" id="editImageFile" accept="image/jpeg,image/png,image/webp,image/gif" />
      </div>
      <div class="upload-progress" id="editUploadProgress">
        <div class="upload-progress-bar" id="editUploadProgressBar"></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="sheetCancel">Cancel</button>
      <button class="btn btn-primary"   id="sheetSave">💾 Save</button>
    </div>
  </div>

  <!-- Delete Confirmation -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-icon">🗑️</div>
      <h3>Delete Product?</h3>
      <p id="confirmMsg">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger"    id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, ensureGitHubToken } from "./app.js";
    import { onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection, query, orderBy, limit, startAfter, getDocs,
      doc, updateDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ── Image upload pulled inline so it doesn't depend on
    //    sessionStorage token being pre-loaded via login flow.
    //    Reads the token from sessionStorage directly when needed.
    async function uploadImage(file) {
      const pat = sessionStorage.getItem("gh_pat");
      if (!pat) throw new Error("GitHub token not found. Please log out and log back in.");
      const ext      = file.name.split(".").pop() || "jpg";
      const base     = file.name.replace(/\.[^/.]+$/,"").replace(/\s+/g,"_").replace(/[^a-zA-Z0-9_\-]/g,"");
      const safeName = `${base}_${Date.now()}.${ext}`;
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = () => res(r.result.split(",")[1]);
        r.onerror = () => rej(new Error("FileReader failed"));
        r.readAsDataURL(file);
      });
      // !! Replace with your actual GitHub username and image repo name !!
      const GH_USERNAME = "Montasir002";
      const GH_REPO     = "image-database";
      const apiUrl = `https://api.github.com/repos/${GH_USERNAME}/${GH_REPO}/contents/images/${safeName}`;
      const resp = await fetch(apiUrl, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${pat}`, "Content-Type": "application/json", "Accept": "application/vnd.github+json" },
        body: JSON.stringify({ message: `Update product image: ${safeName}`, content: b64 })
      });
      if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(`GitHub upload failed: ${e.message||resp.status}`); }
      return `https://cdn.jsdelivr.net/gh/${GH_USERNAME}/${GH_REPO}@main/images/${safeName}`;
    }

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = "index.html"; return; }
      await ensureGitHubToken().catch(()=>{}); // silently reload PAT if missing
    });

    // Drawer
    const drawer  = document.getElementById("drawer");
    const dOverlay= document.getElementById("drawerOverlay");
    document.getElementById("menuBtn").addEventListener("click", () => { drawer.classList.add("open"); dOverlay.classList.add("open"); });
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    dOverlay.addEventListener("click", closeDrawer);
    function closeDrawer() { drawer.classList.remove("open"); dOverlay.classList.remove("open"); }
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth); sessionStorage.removeItem("gh_pat"); window.location.href = "index.html";
    });

    // Toast
    function showToast(msg, type="info") {
      const c = document.getElementById("toastContainer");
      const icons = {success:"✅",error:"❌",info:"ℹ️"};
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.classList.add("dismissing"); t.addEventListener("animationend",()=>t.remove(),{once:true}); }, 4000);
    }

    // State
    const PAGE_SIZE = 25;
    let allLoaded = [], lastDoc = null, hasMore = true, isFetching = false;
    let currentSort = "alpha", searchTerm = "";
    let pendingDeleteId = null, pendingDeleteName = "";

    const grid         = document.getElementById("productGrid");
    const searchEl     = document.getElementById("searchInput");
    const countEl      = document.getElementById("resultCount");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const loadMoreBtn  = document.getElementById("loadMoreBtn");

    const sheetOverlay = document.getElementById("sheetOverlay");
    const bottomSheet  = document.getElementById("bottomSheet");
    const editIdEl     = document.getElementById("editId");
    const editNameEl   = document.getElementById("editName");
    const editBulkPrice= document.getElementById("editBulkPrice");
    const editPieces   = document.getElementById("editPieces");
    const editBulkUnit = document.getElementById("editBulkUnit");
    const editUnitType = document.getElementById("editUnitType");
    const editMrp      = document.getElementById("editMrp");
    const editCostPrev = document.getElementById("editCostPreview");
    const editImgPrev  = document.getElementById("editImagePreview");
    const editImgFile  = document.getElementById("editImageFile");
    const editProgress = document.getElementById("editUploadProgress");
    const editProgFill = document.getElementById("editUploadProgressBar");
    let currentImageUrl = "";


    function buildQuery(afterDoc=null) {
      const col = collection(db,"products");
      const field = currentSort==="alpha" ? "nameLower" : "lastUpdated";
      const dir   = currentSort==="alpha" ? "asc" : "desc";
      return afterDoc
        ? query(col,orderBy(field,dir),startAfter(afterDoc),limit(PAGE_SIZE))
        : query(col,orderBy(field,dir),limit(PAGE_SIZE));
    }

    async function fetchNextBatch() {
      if (isFetching||!hasMore) return;
      isFetching=true; loadMoreBtn.textContent="Loading…"; loadMoreBtn.disabled=true;
      try {
        const snap = await getDocs(buildQuery(lastDoc));
        if (snap.empty||snap.docs.length<PAGE_SIZE) { hasMore=false; loadMoreWrap.style.display="none"; }
        else { loadMoreWrap.style.display="flex"; loadMoreBtn.textContent="Load More"; loadMoreBtn.disabled=false; }
        if (!snap.empty) lastDoc=snap.docs[snap.docs.length-1];
        const fresh = snap.docs.map(d=>({id:d.id,...d.data()}));
        allLoaded.push(...fresh);
        grid.querySelectorAll(".skeleton-card").forEach(s=>s.remove());
        fresh.forEach((p,i)=>grid.appendChild(buildCard(p,allLoaded.length-fresh.length+i)));
        updateCount();
      } catch(err) {
        grid.innerHTML=`<div class="state-message"><div class="icon">⚠️</div><p>Failed to load products.</p></div>`;
      } finally { isFetching=false; }
    }

    loadMoreBtn.addEventListener("click", fetchNextBatch);

    // Sort toggle — shows current state, tap to flip
    const sortToggleBtn = document.getElementById("sortToggleBtn");
    sortToggleBtn.addEventListener("click", () => {
      currentSort = currentSort === "alpha" ? "recent" : "alpha";
      sortToggleBtn.textContent = currentSort === "alpha" ? "A → Z" : "Recent";
      resetAndReload();
    });

    // Eye button — show/hide cost chips on update page
    let showPrices = true;
    const priceEyeBtn = document.getElementById("priceEyeBtn");
    priceEyeBtn.addEventListener("click", () => {
      showPrices = !showPrices;
      priceEyeBtn.classList.toggle("eye-hidden", !showPrices);
      document.querySelectorAll(".buy-price").forEach(chip => {
        chip.classList.toggle("cost-masked", !showPrices);
      });
    });

    let searchTimer;
    searchEl.addEventListener("input",()=>{
      clearTimeout(searchTimer);
      searchTimer=setTimeout(()=>{ searchTerm=searchEl.value.trim().toLowerCase(); renderFiltered(); },200);
    });

    function resetAndReload() {
      allLoaded=[]; lastDoc=null; hasMore=true;
      grid.innerHTML=`<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>`;
      loadMoreWrap.style.display="none"; fetchNextBatch();
    }

    function renderFiltered() {
      const filtered = searchTerm ? allLoaded.filter(p=>p.nameLower&&p.nameLower.includes(searchTerm)) : allLoaded;
      grid.innerHTML="";
      if (!filtered.length) {
        grid.innerHTML=`<div class="state-message"><div class="icon">${searchTerm?"🔎":"📦"}</div><p>${searchTerm?`No results for "<strong>${escapeHtml(searchTerm)}</strong>"`:"No products yet."}</p></div>`;
        updateCount(0); return;
      }
      filtered.forEach((p,i)=>grid.appendChild(buildCard(p,i)));
      updateCount(filtered.length);
    }

    function updateCount(n) {
      const c=n!==undefined?n:allLoaded.length;
      countEl.textContent=c>0?`${c} product${c!==1?"s":""} found`:"";
    }

    function formatTimestamp(ts) {
      if (!ts) return "Unknown";
      const d=ts.toDate?ts.toDate():new Date(ts);
      return `${d.getDate()} ${d.toLocaleString("en-GB",{month:"short"})} ${d.getFullYear()}, ${d.toLocaleString("en-US",{hour:"numeric",minute:"2-digit",hour12:true})}`;
    }

    function buildCard(p,idx) {
      const card=document.createElement("div");
      card.className="product-card";
      card.style.animationDelay=`${Math.min(idx,8)*0.04}s`;
      const bulkText=`1 ${escapeHtml(p.bulkUnit||"unit")} → ${p.piecesPerBulk||"?"} ${escapeHtml(p.unitType||"pcs")}`;
      const costStr=p.buyPricePerUnit!=null?`৳${Number(p.buyPricePerUnit).toFixed(2)}`:"—";
      const mrpHtml=p.mrpPerUnit!=null?`<div class="price-chip mrp-chip"><span class="chip-label">MRP</span><span class="chip-value mrp-amount">৳${Number(p.mrpPerUnit).toFixed(2)}</span></div>`:"";
      const imgHtml=p.imageUrl
        ?`<div class="img-skeleton"><img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name)}" loading="lazy" decoding="async" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'>🛍️</div>'" /></div>`
        :`<div class="no-image">🛍️</div>`;
      card.innerHTML=`
        <div class="product-card-inner">
          <div class="product-image">${imgHtml}</div>
          <div class="product-body">
            <div class="product-name-row">
              <div class="product-name">${escapeHtml(p.name)}</div>
              <button class="more-btn" aria-label="Options">⋮</button>
              <div class="more-dropdown">
                <button class="dropdown-item edit-btn"><span class="di-icon">✏️</span> Edit Product</button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item danger delete-btn"><span class="di-icon">🗑️</span> Delete</button>
                <div class="dropdown-ts">
                  <div class="ts-label">🕒 Last Updated</div>
                  <div class="ts-value">${formatTimestamp(p.lastUpdated)}</div>
                </div>
              </div>
            </div>
            <div class="product-bulk-info">📦 ${escapeHtml(bulkText)} · ৳${Number(p.buyPriceBulk||0).toFixed(2)}</div>
            <div class="product-prices">
              <div class="price-chip buy-price"><span class="chip-label">Cost/${escapeHtml(p.unitType||"unit")}</span><span class="chip-value buy-price-amount">${costStr}</span></div>
              ${mrpHtml}
            </div>
          </div>
        </div>`;

      const moreBtn=card.querySelector(".more-btn");
      const dropdown=card.querySelector(".more-dropdown");
      moreBtn.addEventListener("click",e=>{
        e.stopPropagation();
        e.preventDefault();
        const wasOpen=dropdown.classList.contains("open");
        document.querySelectorAll(".more-dropdown.open").forEach(d=>d.classList.remove("open"));
        if (!wasOpen) setTimeout(()=>dropdown.classList.add("open"), 10);
      });
      card.querySelector(".edit-btn").addEventListener("click",e=>{ e.stopPropagation(); e.preventDefault(); dropdown.classList.remove("open"); setTimeout(()=>openEditSheet(p), 50); });
      card.querySelector(".delete-btn").addEventListener("click",e=>{ e.stopPropagation(); dropdown.classList.remove("open"); openConfirm(p.id,p.name); });
      return card;
    }

    document.addEventListener("click",()=>document.querySelectorAll(".more-dropdown.open").forEach(d=>d.classList.remove("open")));

    // ── Edit Sheet ───────────────────────────────────────
    function openEditSheet(p) {
      document.getElementById("sheetTitle").textContent = `Edit — ${p.name}`;
      editIdEl.value      = p.id;
      editNameEl.value    = p.name||"";
      editBulkPrice.value = p.buyPriceBulk||"";
      editPieces.value    = p.piecesPerBulk||"";
      editBulkUnit.value  = p.bulkUnit||"Packet";
      editUnitType.value  = p.unitType||"";
      editMrp.value       = p.mrpPerUnit!=null ? p.mrpPerUnit : "";
      editImgFile.value   = "";
      currentImageUrl     = p.imageUrl||"";
      editImgPrev.innerHTML = p.imageUrl
        ? `<img src="${escapeHtml(p.imageUrl)}" alt="Current" />`
        : `<div class="placeholder"><div class="icon">📷</div><p>No image</p></div>`;
      updateEditPreview();
      bottomSheet.style.transform=""; bottomSheet.style.transition="";
      bottomSheet.classList.add("open"); sheetOverlay.classList.add("open");
    }

    function closeEditSheet() {
      bottomSheet.style.transition="transform 0.3s cubic-bezier(0.4,0,0.2,1)";
      bottomSheet.classList.remove("open"); sheetOverlay.classList.remove("open");
    }

    function updateEditPreview() {
      const price=parseFloat(editBulkPrice.value), pieces=parseFloat(editPieces.value);
      editCostPrev.textContent=(price>0&&pieces>0)?`৳${(price/pieces).toFixed(2)}`:"—";
    }
    editBulkPrice.addEventListener("input",updateEditPreview);
    editPieces.addEventListener("input",updateEditPreview);

    editImgFile.addEventListener("change",()=>{
      const file=editImgFile.files[0]; if (!file) return;
      editImgPrev.innerHTML=`<img src="${URL.createObjectURL(file)}" alt="Preview" />`;
    });

    document.getElementById("sheetClose").addEventListener("click",  closeEditSheet);
    document.getElementById("sheetCancel").addEventListener("click", closeEditSheet);
    sheetOverlay.addEventListener("click", e => {
      // Only close if clicking the overlay itself, not bubbled events
      if (e.target === sheetOverlay) closeEditSheet();
    });

    // Swipe down to close
    const handleWrap=document.getElementById("sheetHandleWrap");
    let touchStartY=0, isDragging=false;
    handleWrap.addEventListener("touchstart",e=>{ touchStartY=e.touches[0].clientY; isDragging=true; bottomSheet.style.transition="none"; },{passive:true});
    handleWrap.addEventListener("touchmove",e=>{ if (!isDragging) return; const dy=e.touches[0].clientY-touchStartY; if (dy>0) bottomSheet.style.transform=`translateY(${dy}px)`; },{passive:true});
    handleWrap.addEventListener("touchend",e=>{
      if (!isDragging) return; isDragging=false;
      const dy=e.changedTouches[0].clientY-touchStartY;
      if (dy>80) { closeEditSheet(); setTimeout(()=>{ bottomSheet.style.transform=""; },350); }
      else { bottomSheet.style.transition="transform 0.25s ease"; bottomSheet.style.transform=""; }
    },{passive:true});

    // Save
    document.getElementById("sheetSave").addEventListener("click", async () => {
      const id        = editIdEl.value;
      const name      = editNameEl.value.trim();
      const bulkPrice = parseFloat(editBulkPrice.value);
      const pieces    = parseFloat(editPieces.value);
      const bulkUnit  = editBulkUnit.value;
      const unitType  = editUnitType.value.trim();
      const mrp       = parseFloat(editMrp.value)||null;
      const newFile   = editImgFile.files[0]||null;

      if (!name)              { showToast("Product name is required.","error"); return; }
      if (!bulkPrice||bulkPrice<=0){ showToast("Enter a valid bulk price.","error"); return; }
      if (!pieces||pieces<=0) { showToast("Enter valid pieces.","error"); return; }
      if (!unitType)          { showToast("Enter retail unit type.","error"); return; }

      const saveBtn=document.getElementById("sheetSave");
      saveBtn.disabled=true; saveBtn.textContent="Saving…";
      let finalImageUrl=currentImageUrl;

      try {
        if (newFile) {
          saveBtn.textContent="Uploading image…";
          editProgress.classList.add("active"); editProgFill.style.width="40%";
          finalImageUrl=await uploadImage(newFile);
          editProgFill.style.width="80%";
        }
        editProgFill.style.width="95%";
        await updateDoc(doc(db,"products",id),{
          name, nameLower:name.toLowerCase(),
          buyPriceBulk:bulkPrice, bulkUnit, piecesPerBulk:pieces, unitType,
          buyPricePerUnit:parseFloat((bulkPrice/pieces).toFixed(4)),
          mrpPerUnit:mrp, imageUrl:finalImageUrl, lastUpdated:serverTimestamp()
        });
        showToast(`"${name}" updated! ✨`,"success");
        closeEditSheet();
        editProgress.classList.remove("active"); editProgFill.style.width="0%";
        const idx=allLoaded.findIndex(p=>p.id===id);
        if (idx!==-1) allLoaded[idx]={...allLoaded[idx],name,nameLower:name.toLowerCase(),buyPriceBulk:bulkPrice,bulkUnit,piecesPerBulk:pieces,unitType,buyPricePerUnit:parseFloat((bulkPrice/pieces).toFixed(4)),mrpPerUnit:mrp,imageUrl:finalImageUrl};
        renderFiltered();
      } catch(err) {
        showToast(`Error: ${err.message}`,"error");
        editProgress.classList.remove("active"); editProgFill.style.width="0%";
      } finally {
        saveBtn.disabled=false; saveBtn.textContent="💾 Save";
      }
    });

    // Delete
    const confirmOverlay=document.getElementById("confirmOverlay");
    function openConfirm(id,name){ pendingDeleteId=id; pendingDeleteName=name; document.getElementById("confirmMsg").textContent=`"${name}" will be permanently removed. This cannot be undone.`; confirmOverlay.classList.add("open"); }
    document.getElementById("confirmCancel").addEventListener("click",()=>{ confirmOverlay.classList.remove("open"); pendingDeleteId=null; });
    document.getElementById("confirmDelete").addEventListener("click",async()=>{
      if (!pendingDeleteId) return;
      const deleteBtn=document.getElementById("confirmDelete");
      deleteBtn.disabled=true; deleteBtn.textContent="Deleting…";
      try {
        await deleteDoc(doc(db,"products",pendingDeleteId));
        showToast(`"${pendingDeleteName}" deleted.`,"success");
        allLoaded=allLoaded.filter(p=>p.id!==pendingDeleteId);
        renderFiltered();
      } catch(err){ showToast(`Error: ${err.message}`,"error"); }
      finally{ confirmOverlay.classList.remove("open"); pendingDeleteId=null; deleteBtn.disabled=false; deleteBtn.textContent="Delete"; }
    });

    function escapeHtml(str) {
      if (typeof str!=="string") return "";
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    fetchNextBatch();
  </script>
</body>
</html>
