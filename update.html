<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>StoreDesk — Update Price</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-logo">🛒 StoreDesk</span>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-nav">
      <a href="list.html"   class="drawer-link"><span class="link-icon">🏠</span> Counter</a>
      <a href="admin.html"  class="drawer-link"><span class="link-icon">➕</span> Add Product</a>
      <a href="update.html" class="drawer-link active"><span class="link-icon">✏️</span> Update Price</a>
      <div class="drawer-divider"></div>
      <button class="drawer-link danger" id="logoutBtn"><span class="link-icon">🚪</span> Logout</button>
    </div>
  </nav>

  <header class="app-bar">
    <div class="logo">🛒 <span>StoreDesk</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="search-bar-wrap">
    <div class="search-input-row">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Search products…" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search" />
      </div>
    </div>
    <div class="sort-row">
      <span class="sort-label">Sort:</span>
      <button class="sort-btn active" data-sort="alpha">A → Z</button>
      <button class="sort-btn" data-sort="recent">Recent</button>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <main class="product-grid" id="productGrid">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </main>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="btn btn-secondary load-more-btn" id="loadMoreBtn">Load More</button>
  </div>

  <!-- Edit Bottom Sheet -->
  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <span class="sheet-title" id="sheetTitle">Edit Product</span>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body">
      <input type="hidden" id="editId" />
      <div class="form-group">
        <label for="editName">Product Name</label>
        <input type="text" id="editName" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="editBulkPrice">Bulk Buy Price (৳)</label>
          <input type="number" id="editBulkPrice" min="0" step="0.01" inputmode="decimal" />
        </div>
        <div class="form-group">
          <label for="editPieces">Pieces / Qty</label>
          <input type="number" id="editPieces" min="1" step="1" inputmode="numeric" />
        </div>
      </div>
      <!-- Live cost preview inside sheet -->
      <div class="cost-preview" style="margin-bottom:16px;">
        <span class="label">New Cost / Unit</span>
        <span class="value" id="editCostPreview">—</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="editBulkUnit">Bulk Unit</label>
          <select id="editBulkUnit">
            <option value="Packet">Packet</option>
            <option value="Box">Box</option>
            <option value="Sack">Sack</option>
            <option value="Bag">Bag</option>
            <option value="Carton">Carton</option>
            <option value="Bundle">Bundle</option>
            <option value="Dozen">Dozen</option>
            <option value="Crate">Crate</option>
            <option value="Drum">Drum</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editUnitType">Retail Unit</label>
          <input type="text" id="editUnitType" placeholder="Pcs, KG, Ltr…" />
        </div>
      </div>
      <div class="form-group">
        <label for="editMrp">MRP per Unit (৳)</label>
        <input type="number" id="editMrp" min="0" step="0.01" inputmode="decimal" placeholder="Optional" />
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="sheetCancel">Cancel</button>
      <button class="btn btn-primary"   id="sheetSave">💾 Save</button>
    </div>
  </div>

  <!-- Delete Confirmation Dialog -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-icon">🗑️</div>
      <h3>Delete Product?</h3>
      <p id="confirmMsg">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger"    id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./app.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection, query, orderBy, limit, startAfter, getDocs,
      doc, updateDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, user => { if (!user) window.location.href = "index.html"; });

    // ── Drawer ───────────────────────────────────────────
    const drawer  = document.getElementById("drawer");
    const overlay = document.getElementById("drawerOverlay");
    document.getElementById("menuBtn").addEventListener("click", () => { drawer.classList.add("open"); overlay.classList.add("open"); });
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth); sessionStorage.removeItem("gh_pat"); window.location.href = "index.html";
    });

    // ── Toast ────────────────────────────────────────────
    function showToast(message, type="info") {
      const c = document.getElementById("toastContainer");
      const icons = {success:"✅",error:"❌",info:"ℹ️"};
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.classList.add("dismissing"); t.addEventListener("animationend", () => t.remove(), {once:true}); }, 4000);
    }

    // ── State ────────────────────────────────────────────
    const PAGE_SIZE  = 25;
    let allLoaded    = [];
    let lastDoc      = null;
    let hasMore      = true;
    let isFetching   = false;
    let currentSort  = "alpha";
    let searchTerm   = "";
    let pendingDeleteId   = null;
    let pendingDeleteName = "";

    const grid         = document.getElementById("productGrid");
    const searchEl     = document.getElementById("searchInput");
    const countEl      = document.getElementById("resultCount");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const loadMoreBtn  = document.getElementById("loadMoreBtn");

    // ── Firestore ────────────────────────────────────────
    function buildQuery(afterDoc=null) {
      const col   = collection(db, "products");
      const field = currentSort === "alpha" ? "nameLower" : "lastUpdated";
      const dir   = currentSort === "alpha" ? "asc" : "desc";
      return afterDoc
        ? query(col, orderBy(field,dir), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(col, orderBy(field,dir), limit(PAGE_SIZE));
    }

    async function fetchNextBatch() {
      if (isFetching || !hasMore) return;
      isFetching = true; loadMoreBtn.textContent = "Loading…"; loadMoreBtn.disabled = true;
      try {
        const snap = await getDocs(buildQuery(lastDoc));
        if (snap.empty || snap.docs.length < PAGE_SIZE) { hasMore = false; loadMoreWrap.style.display = "none"; }
        else { loadMoreWrap.style.display = "flex"; loadMoreBtn.textContent = "Load More"; loadMoreBtn.disabled = false; }
        if (!snap.empty) lastDoc = snap.docs[snap.docs.length - 1];
        const newProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        allLoaded.push(...newProducts);
        grid.querySelectorAll(".skeleton-card").forEach(s => s.remove());
        newProducts.forEach((p, i) => grid.appendChild(buildCard(p, allLoaded.length - newProducts.length + i)));
        updateCount();
      } catch(err) {
        grid.innerHTML = `<div class="state-message"><div class="icon">⚠️</div><p>Failed to load products.</p></div>`;
      } finally { isFetching = false; }
    }

    loadMoreBtn.addEventListener("click", fetchNextBatch);

    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.sort === currentSort) return;
        currentSort = btn.dataset.sort;
        document.querySelectorAll(".sort-btn").forEach(b => b.classList.toggle("active", b.dataset.sort === currentSort));
        resetAndReload();
      });
    });

    let searchTimer;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchTerm = searchEl.value.trim().toLowerCase(); renderFiltered(); }, 200);
    });

    function resetAndReload() {
      allLoaded = []; lastDoc = null; hasMore = true; searchTerm = searchEl.value.trim().toLowerCase();
      grid.innerHTML = `<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>`;
      loadMoreWrap.style.display = "none";
      fetchNextBatch();
    }

    function renderFiltered() {
      const filtered = searchTerm ? allLoaded.filter(p => p.nameLower && p.nameLower.includes(searchTerm)) : allLoaded;
      grid.innerHTML = "";
      if (!filtered.length) {
        grid.innerHTML = `<div class="state-message"><div class="icon">${searchTerm?"🔎":"📦"}</div><p>${searchTerm?`No results for "<strong>${escapeHtml(searchTerm)}</strong>"`:"No products yet."}</p></div>`;
        updateCount(0); return;
      }
      filtered.forEach((p,i) => grid.appendChild(buildCard(p,i)));
      updateCount(filtered.length);
    }

    function updateCount(n) {
      const c = n !== undefined ? n : allLoaded.length;
      countEl.textContent = c > 0 ? `${c} product${c!==1?"s":""} found` : "";
    }

    function formatTimestamp(ts) {
      if (!ts) return "Unknown";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return `${d.getDate()} ${d.toLocaleString("en-GB",{month:"short"})} ${d.getFullYear()}, ${d.toLocaleString("en-US",{hour:"numeric",minute:"2-digit",hour12:true})}`;
    }

    // ── Card Builder ─────────────────────────────────────
    function buildCard(p, idx) {
      const card = document.createElement("div");
      card.className = "product-card";
      card.style.animationDelay = `${Math.min(idx,8)*0.04}s`;

      const bulkText = `1 ${escapeHtml(p.bulkUnit||"unit")} → ${p.piecesPerBulk||"?"} ${escapeHtml(p.unitType||"pcs")}`;
      const costStr  = p.buyPricePerUnit != null ? `৳${Number(p.buyPricePerUnit).toFixed(2)}` : "—";
      const mrpHtml  = p.mrpPerUnit != null
        ? `<div class="price-chip mrp-chip"><span class="chip-label">MRP</span><span class="chip-value mrp-amount">৳${Number(p.mrpPerUnit).toFixed(2)}</span></div>` : "";

      const imgHtml = p.imageUrl
        ? `<div class="img-skeleton"><img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name)}" loading="lazy" decoding="async" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'>🛍️</div>'" /></div>`
        : `<div class="no-image">🛍️</div>`;

      card.innerHTML = `
        <div class="product-card-inner">
          <div class="product-image">${imgHtml}</div>
          <div class="product-body">
            <div class="product-name-row">
              <div class="product-name">${escapeHtml(p.name)}</div>
              <button class="more-btn" aria-label="Options">⋮</button>
              <div class="more-dropdown">
                <button class="dropdown-item edit-btn"><span class="di-icon">✏️</span> Edit Product</button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item danger delete-btn"><span class="di-icon">🗑️</span> Delete</button>
                <div class="dropdown-ts">
                  <div class="ts-label">🕒 Last Updated</div>
                  <div class="ts-value">${formatTimestamp(p.lastUpdated)}</div>
                </div>
              </div>
            </div>
            <div class="product-bulk-info">📦 ${escapeHtml(bulkText)} · ৳${Number(p.buyPriceBulk||0).toFixed(2)}</div>
            <div class="product-prices">
              <div class="price-chip buy-price">
                <span class="chip-label">Cost/${escapeHtml(p.unitType||"unit")}</span>
                <span class="chip-value buy-price-amount">${costStr}</span>
              </div>
              ${mrpHtml}
            </div>
          </div>
        </div>`;

      // Triple dot
      const moreBtn  = card.querySelector(".more-btn");
      const dropdown = card.querySelector(".more-dropdown");
      moreBtn.addEventListener("click", e => {
        e.stopPropagation();
        const wasOpen = dropdown.classList.contains("open");
        document.querySelectorAll(".more-dropdown.open").forEach(d => d.classList.remove("open"));
        if (!wasOpen) dropdown.classList.add("open");
      });

      // Edit
      card.querySelector(".edit-btn").addEventListener("click", e => {
        e.stopPropagation();
        dropdown.classList.remove("open");
        openEditSheet(p);
      });

      // Delete
      card.querySelector(".delete-btn").addEventListener("click", e => {
        e.stopPropagation();
        dropdown.classList.remove("open");
        openConfirm(p.id, p.name);
      });

      return card;
    }

    document.addEventListener("click", () => {
      document.querySelectorAll(".more-dropdown.open").forEach(d => d.classList.remove("open"));
    });

    // ── Edit Bottom Sheet ────────────────────────────────
    const sheetOverlay  = document.getElementById("sheetOverlay");
    const bottomSheet   = document.getElementById("bottomSheet");
    const sheetTitle    = document.getElementById("sheetTitle");
    const editIdEl      = document.getElementById("editId");
    const editNameEl    = document.getElementById("editName");
    const editBulkPrice = document.getElementById("editBulkPrice");
    const editPieces    = document.getElementById("editPieces");
    const editBulkUnit  = document.getElementById("editBulkUnit");
    const editUnitType  = document.getElementById("editUnitType");
    const editMrp       = document.getElementById("editMrp");
    const editCostPrev  = document.getElementById("editCostPreview");

    function openEditSheet(p) {
      sheetTitle.textContent   = `Edit — ${p.name}`;
      editIdEl.value           = p.id;
      editNameEl.value         = p.name || "";
      editBulkPrice.value      = p.buyPriceBulk || "";
      editPieces.value         = p.piecesPerBulk || "";
      editBulkUnit.value       = p.bulkUnit || "Packet";
      editUnitType.value       = p.unitType || "";
      editMrp.value            = p.mrpPerUnit || "";
      updateEditPreview();
      bottomSheet.classList.add("open");
      sheetOverlay.classList.add("open");
    }

    function closeEditSheet() {
      bottomSheet.classList.remove("open");
      sheetOverlay.classList.remove("open");
    }

    function updateEditPreview() {
      const price = parseFloat(editBulkPrice.value), pieces = parseFloat(editPieces.value);
      editCostPrev.textContent = (price > 0 && pieces > 0) ? `৳${(price/pieces).toFixed(2)}` : "—";
    }

    editBulkPrice.addEventListener("input", updateEditPreview);
    editPieces.addEventListener("input",    updateEditPreview);

    document.getElementById("sheetClose").addEventListener("click",  closeEditSheet);
    document.getElementById("sheetCancel").addEventListener("click", closeEditSheet);
    sheetOverlay.addEventListener("click", closeEditSheet);

    document.getElementById("sheetSave").addEventListener("click", async () => {
      const id        = editIdEl.value;
      const name      = editNameEl.value.trim();
      const bulkPrice = parseFloat(editBulkPrice.value);
      const pieces    = parseFloat(editPieces.value);
      const bulkUnit  = editBulkUnit.value;
      const unitType  = editUnitType.value.trim();
      const mrp       = parseFloat(editMrp.value) || null;

      if (!name)              { showToast("Product name is required.", "error"); return; }
      if (!bulkPrice || bulkPrice <= 0) { showToast("Enter a valid bulk price.", "error"); return; }
      if (!pieces || pieces <= 0) { showToast("Enter valid pieces.", "error"); return; }
      if (!unitType)          { showToast("Enter retail unit type.", "error"); return; }

      const saveBtn = document.getElementById("sheetSave");
      saveBtn.disabled = true; saveBtn.textContent = "Saving…";

      try {
        await updateDoc(doc(db, "products", id), {
          name, nameLower: name.toLowerCase(),
          buyPriceBulk: bulkPrice, bulkUnit, piecesPerBulk: pieces, unitType,
          buyPricePerUnit: parseFloat((bulkPrice/pieces).toFixed(4)),
          mrpPerUnit: mrp, lastUpdated: serverTimestamp()
        });
        showToast(`"${name}" updated! ✨`, "success");
        closeEditSheet();
        // Update local array and re-render
        const idx = allLoaded.findIndex(p => p.id === id);
        if (idx !== -1) {
          allLoaded[idx] = { ...allLoaded[idx], name, nameLower: name.toLowerCase(), buyPriceBulk: bulkPrice, bulkUnit, piecesPerBulk: pieces, unitType, buyPricePerUnit: parseFloat((bulkPrice/pieces).toFixed(4)), mrpPerUnit: mrp };
        }
        renderFiltered();
      } catch(err) {
        showToast(`Error: ${err.message}`, "error");
      } finally {
        saveBtn.disabled = false; saveBtn.textContent = "💾 Save";
      }
    });

    // ── Delete Confirmation ──────────────────────────────
    const confirmOverlay = document.getElementById("confirmOverlay");

    function openConfirm(id, name) {
      pendingDeleteId   = id;
      pendingDeleteName = name;
      document.getElementById("confirmMsg").textContent = `"${name}" will be permanently removed. This cannot be undone.`;
      confirmOverlay.classList.add("open");
    }

    document.getElementById("confirmCancel").addEventListener("click", () => {
      confirmOverlay.classList.remove("open");
      pendingDeleteId = null;
    });

    document.getElementById("confirmDelete").addEventListener("click", async () => {
      if (!pendingDeleteId) return;
      const deleteBtn = document.getElementById("confirmDelete");
      deleteBtn.disabled = true; deleteBtn.textContent = "Deleting…";
      try {
        await deleteDoc(doc(db, "products", pendingDeleteId));
        showToast(`"${pendingDeleteName}" deleted.`, "success");
        allLoaded = allLoaded.filter(p => p.id !== pendingDeleteId);
        renderFiltered();
      } catch(err) {
        showToast(`Error: ${err.message}`, "error");
      } finally {
        confirmOverlay.classList.remove("open");
        pendingDeleteId = null;
        deleteBtn.disabled = false; deleteBtn.textContent = "Delete";
      }
    });

    function escapeHtml(str) {
      if (typeof str !== "string") return "";
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    fetchNextBatch();
  </script>
</body>
</html>
