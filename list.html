<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>StoreDesk — Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-logo">🛒 StoreDesk</span>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-nav">
      <a href="list.html"   class="drawer-link active"><span class="link-icon">🏠</span> Counter</a>
      <a href="admin.html"  class="drawer-link"><span class="link-icon">➕</span> Add Product</a>
      <a href="update.html" class="drawer-link"><span class="link-icon">✏️</span> Update Price</a>
      <div class="drawer-divider"></div>
      <button class="drawer-link danger" id="logoutBtn"><span class="link-icon">🚪</span> Logout</button>
    </div>
  </nav>

  <header class="app-bar">
    <div class="logo">🛒 <span>StoreDesk</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="search-bar-wrap">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Search products…"
        autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search" />
    </div>
    <div class="controls-row">
      <button class="sort-toggle-btn" id="sortToggleBtn">A → Z</button>
      <button class="price-eye-btn" id="priceEyeBtn">👁</button>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <main class="product-grid" id="productGrid">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </main>
  <!-- Invisible sentinel — triggers auto-load when scrolled into view -->
  <div id="scrollSentinel" style="height:1px;"></div>

  <script type="module">
    import { auth, db } from "./app.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, orderBy, limit, startAfter, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, user => { if (!user) window.location.href = "index.html"; });

    // Drawer
    const drawer  = document.getElementById("drawer");
    const overlay = document.getElementById("drawerOverlay");
    document.getElementById("menuBtn").addEventListener("click", () => { drawer.classList.add("open"); overlay.classList.add("open"); });
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth); sessionStorage.removeItem("gh_pat"); window.location.href = "index.html";
    });

    // ── State ────────────────────────────────────────────
    const PAGE_SIZE       = 25;
    let allLoaded         = [];
    let lastDoc           = null;
    let hasMore           = true;
    let isFetching        = false;
    let hideWholesale     = false;
    let currentSort       = "alpha";
    let searchTerm        = "";
    let allProductsLoaded = false;
    let isLoadingAll      = false;
    const revealedIds     = new Set();

    const grid    = document.getElementById("productGrid");
    const searchEl= document.getElementById("searchInput");
    const countEl = document.getElementById("resultCount");

    // ── Auto-scroll: IntersectionObserver ───────────────
    const sentinel = document.getElementById("scrollSentinel");
    const scrollObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !searchTerm && !isFetching && hasMore) {
        fetchNextBatch();
      }
    }, { rootMargin: "200px" });
    scrollObserver.observe(sentinel);

    // ── Firestore query builder ──────────────────────────
    function buildQuery(afterDoc=null) {
      const col   = collection(db, "products");
      const field = currentSort === "alpha" ? "nameLower" : "lastUpdated";
      const dir   = currentSort === "alpha" ? "asc" : "desc";
      return afterDoc
        ? query(col, orderBy(field, dir), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(col, orderBy(field, dir), limit(PAGE_SIZE));
    }

    // ── Fetch next batch ─────────────────────────────────
    async function fetchNextBatch() {
      if (isFetching || !hasMore) return;
      isFetching = true;
      const loader = document.createElement("div");
      loader.id = "bottomLoader"; loader.className = "bottom-loader";
      loader.innerHTML = "<div class=\"spinner\"></div>";
      sentinel.before(loader);
      try {
        const snap = await getDocs(buildQuery(lastDoc));
        if (snap.empty || snap.docs.length < PAGE_SIZE) hasMore = false;
        if (!snap.empty) lastDoc = snap.docs[snap.docs.length - 1];
        const newProducts = snap.docs.map(d => {
          const data = d.data();
          if (!data.nameLower && data.name) data.nameLower = data.name.toLowerCase();
          return { id: d.id, ...data };
        });
        allLoaded.push(...newProducts);
        grid.querySelectorAll(".skeleton-card").forEach(s => s.remove());
        newProducts.forEach((p, i) => grid.appendChild(buildCard(p, allLoaded.length - newProducts.length + i)));
        updateCount();
      } catch(err) {
        console.error("fetchNextBatch:", err);
        grid.querySelectorAll(".skeleton-card").forEach(s => s.remove());
        grid.innerHTML += `<div class="state-message"><div class="icon">⚠️</div><p>${escapeHtml(err.message || "Failed to load products.")}</p></div>`;
      } finally {
        isFetching = false;
        document.getElementById("bottomLoader")?.remove();
      }
    }

    // ── Sort toggle ──────────────────────────────────────
    document.getElementById("sortToggleBtn").addEventListener("click", () => {
      currentSort = currentSort === "alpha" ? "recent" : "alpha";
      document.getElementById("sortToggleBtn").textContent = currentSort === "alpha" ? "A → Z" : "Recent";
      resetAndReload();
    });

    // ── Search: tap → load all → fuzzy search ───────────
    searchEl.addEventListener("focus", async () => {
      if (allProductsLoaded || isLoadingAll) return;
      isLoadingAll = true;
      searchEl.placeholder = "Loading all products…";
      while (hasMore && !isFetching) {
        await fetchNextBatch();
        await new Promise(r => setTimeout(r, 50));
      }
      allProductsLoaded = true;
      isLoadingAll = false;
      searchEl.placeholder = "Search products…";
    });

    let searchTimer;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchTerm = searchEl.value.trim();
        renderFiltered();
      }, 200);
    });

    // ── Eye button ───────────────────────────────────────
    const priceEyeBtn = document.getElementById("priceEyeBtn");
    priceEyeBtn.addEventListener("click", () => {
      hideWholesale = !hideWholesale;
      priceEyeBtn.classList.toggle("eye-hidden", hideWholesale);
      revealedIds.clear();
      document.querySelectorAll(".buy-price").forEach(chip => applyMask(chip, chip.dataset.id));
    });

    // ── Privacy toggle ───────────────────────────────────
    function applyMask(chip, id) {
      const masked = hideWholesale && !revealedIds.has(id);
      chip.classList.toggle("cost-masked", masked);
      chip.style.cursor = masked ? "pointer" : "default";
    }

    // ── Reset and reload ─────────────────────────────────
    function resetAndReload() {
      allLoaded = []; lastDoc = null; hasMore = true; revealedIds.clear();
      allProductsLoaded = false; isLoadingAll = false;
      searchTerm = ""; searchEl.value = "";
      grid.innerHTML = `<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>`;
      fetchNextBatch();
    }

    // ── Render filtered (fuzzy) ──────────────────────────
    function fuzzyScore(name, query) {
      if (!name || !query) return 0;
      const n = name.toLowerCase(), q = query.toLowerCase();
      if (n.includes(q)) return 100;
      const qT = q.split(/\s+/).filter(Boolean), nT = n.split(/\s+/).filter(Boolean);
      let hits = 0;
      for (const qt of qT) { for (const nt of nT) { if (nt.includes(qt)||qt.includes(nt)) { hits++; break; } } }
      if (hits === qT.length) return 80;
      if (hits > 0) return 40 + (hits / qT.length) * 30;
      let best = 0;
      for (const qt of qT) for (const nt of nT) {
        const d = levenshtein(nt, qt), mx = Math.max(nt.length, qt.length);
        const s = (1 - d / mx) * 70;
        if (s > best) best = s;
      }
      return Math.max((1 - levenshtein(n, q) / Math.max(n.length, q.length)) * 60, best);
    }

    function levenshtein(a, b) {
      const sa = [...a], sb = [...b], la = sa.length, lb = sb.length;
      if (!la) return lb; if (!lb) return la;
      const dp = Array.from({length:la+1}, (_,i) =>
        Array.from({length:lb+1}, (_,j) => i===0 ? j : j===0 ? i : 0));
      for (let i=1;i<=la;i++) for (let j=1;j<=lb;j++)
        dp[i][j] = sa[i-1]===sb[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
      return dp[la][lb];
    }

    const FUZZY_THRESHOLD = 25;

    function renderFiltered() {
      const filtered = searchTerm
        ? allLoaded
            .map(p => ({ p, score: fuzzyScore(p.name || "", searchTerm) }))
            .filter(({ score }) => score >= FUZZY_THRESHOLD)
            .sort((a, b) => b.score - a.score)
            .map(({ p }) => p)
        : allLoaded;
      grid.innerHTML = "";
      if (!filtered.length) {
        grid.innerHTML = `<div class="state-message"><div class="icon">${searchTerm ? "🔎" : "📦"}</div><p>${searchTerm ? `No results for "<strong>${escapeHtml(searchTerm)}</strong>"` : "No products yet."}</p></div>`;
        updateCount(0); return;
      }
      filtered.forEach((p, i) => grid.appendChild(buildCard(p, i)));
      updateCount(filtered.length);
    }

    function updateCount(n) {
      const count = n !== undefined ? n : allLoaded.length;
      countEl.textContent = count > 0 ? `${count} product${count !== 1 ? "s" : ""} found` : "";
    }

    // ── Timestamp formatter ──────────────────────────────
    function formatTimestamp(ts) {
      if (!ts) return "Unknown";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return `${d.getDate()} ${d.toLocaleString("en-GB",{month:"short"})} ${d.getFullYear()}, ${d.toLocaleString("en-US",{hour:"numeric",minute:"2-digit",hour12:true})}`;
    }

    // ── Card builder ─────────────────────────────────────
    function buildCard(p, idx) {
      const card = document.createElement("div");
      card.className = "product-card";
      card.style.animationDelay = `${Math.min(idx, 8) * 0.04}s`;

      const bulkText = `1 ${escapeHtml(p.bulkUnit||"unit")} → ${p.piecesPerBulk||"?"} ${escapeHtml(p.unitType||"pcs")}`;
      const costStr  = p.buyPricePerUnit != null ? `৳${Number(p.buyPricePerUnit).toFixed(2)}` : "—";
      const isMasked = hideWholesale && !revealedIds.has(p.id);

      const mrpHtml = p.mrpPerUnit != null
        ? `<div class="price-chip mrp-chip"><span class="chip-label">MRP</span><span class="chip-value mrp-amount">৳${Number(p.mrpPerUnit).toFixed(2)}</span></div>` : "";

      const imgHtml = p.imageUrl
        ? `<div class="img-skeleton"><img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name)}" loading="lazy" decoding="async" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'>🛍️</div>'" /></div>`
        : `<div class="no-image">🛍️</div>`;

      card.innerHTML = `
        <div class="product-card-inner">
          <div class="product-image">${imgHtml}</div>
          <div class="product-body">
            <div class="product-name-row">
              <div class="product-name">${escapeHtml(p.name)}</div>
              <button class="more-btn" aria-label="More info">⋮</button>
              <div class="more-dropdown">
                <div class="dropdown-ts">
                  <div class="ts-label">🕒 Last Updated</div>
                  <div class="ts-value">${formatTimestamp(p.lastUpdated)}</div>
                </div>
              </div>
            </div>
            <div class="product-bulk-info">📦 ${escapeHtml(bulkText)} · ৳${Number(p.buyPriceBulk||0).toFixed(2)}</div>
            <div class="product-prices">
              <div class="price-chip buy-price ${isMasked ? "cost-masked" : ""}" data-id="${escapeHtml(p.id)}" style="cursor:${isMasked ? "pointer" : "default"}">
                <span class="chip-label">Cost/${escapeHtml(p.unitType||"unit")}</span>
                <span class="chip-value buy-price-amount">${costStr}</span>
                <span class="cost-mask"><span></span><span></span><span></span></span>
              </div>
              ${mrpHtml}
            </div>
          </div>
        </div>`;

      // Tap-to-reveal cost
      const chip = card.querySelector(".buy-price");
      chip.addEventListener("click", () => {
        if (!hideWholesale) return;
        revealedIds.has(p.id) ? revealedIds.delete(p.id) : revealedIds.add(p.id);
        applyMask(chip, p.id);
      });

      // Triple dot dropdown (smart positioning — body appended)
      const moreBtn  = card.querySelector(".more-btn");
      const dropdown = card.querySelector(".more-dropdown");
      moreBtn.addEventListener("click", e => {
        e.stopPropagation(); e.preventDefault();
        const existing = document.querySelector(".more-dropdown.open");
        if (existing) { existing.classList.remove("open"); existing._cleanup && existing._cleanup(); }
        if (existing === dropdown) return;
        const btnRect    = moreBtn.getBoundingClientRect();
        const spaceBelow = window.innerHeight - btnRect.bottom;
        dropdown.style.position = "fixed";
        dropdown.style.right    = (window.innerWidth - btnRect.right) + "px";
        dropdown.style.width    = "180px";
        dropdown.style.zIndex   = "9999";
        if (spaceBelow >= 120 || spaceBelow >= btnRect.top) {
          dropdown.style.top = (btnRect.bottom + 6) + "px"; dropdown.style.bottom = "auto";
        } else {
          dropdown.style.bottom = (window.innerHeight - btnRect.top + 6) + "px"; dropdown.style.top = "auto";
        }
        document.body.appendChild(dropdown);
        dropdown.classList.add("open");
        dropdown._cleanup = () => { card.querySelector(".product-name-row").appendChild(dropdown); dropdown.style.cssText = ""; };
      });

      return card;
    }

    document.addEventListener("click", () => {
      document.querySelectorAll(".more-dropdown.open").forEach(d => {
        d.classList.remove("open"); d._cleanup && d._cleanup();
      });
    });

    function escapeHtml(str) {
      if (typeof str !== "string") return "";
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    fetchNextBatch();
  </script>
</body>
</html>
