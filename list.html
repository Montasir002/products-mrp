<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>StoreDesk — Counter List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-bar">
    <div class="logo">🛒 <span>StoreDesk</span></div>
    <nav class="nav-links">
      <a href="admin.html">Admin</a>
      <a href="list.html" class="active">Counter</a>
      <button id="logoutBtn">Logout</button>
    </nav>
  </header>

  <div class="search-bar-wrap">
    <div class="search-input-row">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          id="searchInput"
          placeholder="Search products…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          inputmode="search"
        />
      </div>
      <div class="privacy-toggle">
        <label class="toggle-switch" title="Hide wholesale cost from customers">
          <input type="checkbox" id="hidePriceToggle" />
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label">Hide<br>Cost</span>
      </div>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>

  <main class="product-grid" id="productGrid">
    <div class="state-message">
      <div class="spinner"></div>
      <p>Loading inventory…</p>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./app.js";
    import { onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, onSnapshot, query, orderBy }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      sessionStorage.removeItem("gh_pat");
      window.location.href = "index.html";
    });

    // ── State ────────────────────────────────────────────
    let allProducts   = [];
    let hideWholesale = false;
    const revealedIds = new Set();

    const grid     = document.getElementById("productGrid");
    const searchEl = document.getElementById("searchInput");
    const toggleEl = document.getElementById("hidePriceToggle");
    const countEl  = document.getElementById("resultCount");

    // ── Firestore ────────────────────────────────────────
    const q = query(collection(db, "products"), orderBy("lastUpdated", "desc"));
    onSnapshot(q, (snapshot) => {
      allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderList();
    }, (err) => {
      console.error("[list.js]", err);
      grid.innerHTML = `<div class="state-message"><div class="icon">⚠️</div><p>Failed to load.<br>Check your connection.</p></div>`;
    });

    searchEl.addEventListener("input", renderList);

    toggleEl.addEventListener("change", () => {
      hideWholesale = toggleEl.checked;
      revealedIds.clear();
      renderList();
    });

    // ── Render ───────────────────────────────────────────
    function renderList() {
      const term = searchEl.value.trim().toLowerCase();
      const filtered = term
        ? allProducts.filter(p => p.nameLower && p.nameLower.includes(term))
        : allProducts;

      countEl.textContent = filtered.length > 0
        ? `${filtered.length} product${filtered.length !== 1 ? "s" : ""} found`
        : "";

      grid.innerHTML = "";

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="state-message">
            <div class="icon">${term ? "🔎" : "📦"}</div>
            <p>${term
              ? `No products matching "<strong>${escapeHtml(term)}</strong>"`
              : "No products yet.<br>Add some from the Admin panel."
            }</p>
          </div>`;
        return;
      }

      filtered.forEach((product, idx) => {
        grid.appendChild(buildCard(product, idx));
      });
    }

    // ── Format Timestamp ─────────────────────────────────
    // Output: "12 Jun 2025, 8:45 PM"
    function formatTimestamp(ts) {
      if (!ts) return "Unknown";
      const date = ts.toDate ? ts.toDate() : new Date(ts);
      const day   = date.getDate();
      const month = date.toLocaleString("en-GB", { month: "short" });
      const year  = date.getFullYear();
      const time  = date.toLocaleString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
      return `${day} ${month} ${year}, ${time}`;
    }

    // ── Card Builder ─────────────────────────────────────
    function buildCard(p, idx) {
      const card = document.createElement("div");
      card.className = "product-card";
      card.style.animationDelay = `${idx * 0.04}s`;

      const imageHtml = p.imageUrl
        ? `<img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name)}" loading="lazy" />`
        : `<div class="no-image">🛍️</div>`;

      const bulkText = `1 ${escapeHtml(p.bulkUnit || "unit")} → ${p.piecesPerBulk || "?"} ${escapeHtml(p.unitType || "pcs")}`;
      const costStr  = p.buyPricePerUnit != null ? `৳${Number(p.buyPricePerUnit).toFixed(2)}` : "—";
      const tsStr    = formatTimestamp(p.lastUpdated);

      const mrpHtml = p.mrpPerUnit != null
        ? `<div class="price-chip mrp-chip">
             <span class="chip-label">MRP</span>
             <span class="chip-value mrp-amount">৳${Number(p.mrpPerUnit).toFixed(2)}</span>
           </div>`
        : "";

      const isRevealed = revealedIds.has(p.id);
      const blurClass  = hideWholesale && !isRevealed ? "cost-hidden" : "";
      const tapHint    = hideWholesale && !isRevealed ? "tap-hint" : "";

      card.innerHTML = `
        <div class="product-card-inner">

          <div class="product-image">${imageHtml}</div>

          <div class="product-body">
            <div class="product-name-row">
              <div class="product-name">${escapeHtml(p.name)}</div>

              <!-- ⋮ More button -->
              <button class="more-btn" aria-label="More info" data-id="${escapeHtml(p.id)}">⋮</button>

              <!-- Dropdown anchored to top-right -->
              <div class="more-dropdown" id="dropdown-${escapeHtml(p.id)}">
                <div class="dropdown-row">
                  <span class="dropdown-icon">🕒</span>
                  <div>
                    <div class="dropdown-label">Last Updated</div>
                    <div class="dropdown-value">${tsStr}</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="product-bulk-info">
              📦 ${escapeHtml(bulkText)} &nbsp;·&nbsp; ৳${Number(p.buyPriceBulk || 0).toFixed(2)}
            </div>

            <div class="product-prices">
              <div class="price-chip buy-price ${blurClass}" data-id="${escapeHtml(p.id)}">
                <span class="chip-label">Cost/${escapeHtml(p.unitType || "unit")}</span>
                <span class="chip-value buy-price-amount">${costStr}</span>
                <span class="reveal-hint ${tapHint}">👆 Tap</span>
              </div>
              ${mrpHtml}
            </div>
          </div>

        </div>
      `;

      // ── Cost chip tap-to-reveal ───────────────────────
      const costChip = card.querySelector(".buy-price");
      costChip.addEventListener("click", () => {
        if (!hideWholesale) return;
        const id = costChip.dataset.id;
        if (revealedIds.has(id)) {
          revealedIds.delete(id);
        } else {
          revealedIds.add(id);
        }
        const revealed = revealedIds.has(id);
        costChip.classList.toggle("cost-hidden", !revealed);
        const hint = costChip.querySelector(".reveal-hint");
        if (hint) hint.classList.toggle("tap-hint", !revealed);
      });

      // ── Triple dot dropdown ───────────────────────────
      const moreBtn  = card.querySelector(".more-btn");
      const dropdown = card.querySelector(`#dropdown-${p.id}`);

      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = dropdown.classList.contains("open");

        // Close any other open dropdowns first
        document.querySelectorAll(".more-dropdown.open").forEach(d => d.classList.remove("open"));

        if (!isOpen) dropdown.classList.add("open");
      });

      return card;
    }

    // ── Close dropdown on outside tap ────────────────────
    document.addEventListener("click", () => {
      document.querySelectorAll(".more-dropdown.open").forEach(d => d.classList.remove("open"));
    });

    // ── XSS Helper ───────────────────────────────────────
    function escapeHtml(str) {
      if (typeof str !== "string") return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

  </script>
</body>
</html>
