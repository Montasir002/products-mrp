<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Grocery Manager — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">🛒</div>
        <h1>StoreDesk</h1>
        <p>Inventory &amp; Price Management</p>
      </div>
      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input type="email" id="emailInput" placeholder="admin@yourstore.com" autocomplete="email" inputmode="email" />
      </div>
      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="loginBtn" style="margin-top:8px;">
        <span id="loginBtnText">Sign In</span>
      </button>
    </div>
  </div>
  <script type="module">
    import { auth, loadGitHubToken } from "./app.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    function showToast(message, type="info") {
      const c = document.getElementById("toastContainer");
      const icons = { success:"✅", error:"❌", info:"ℹ️" };
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.classList.add("dismissing"); t.addEventListener("animationend", () => t.remove(), {once:true}); }, 3500);
    }
    const loginBtn   = document.getElementById("loginBtn");
    const btnText    = document.getElementById("loginBtnText");
    const emailEl    = document.getElementById("emailInput");
    const passwordEl = document.getElementById("passwordInput");
    [emailEl, passwordEl].forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); }));
    loginBtn.addEventListener("click", async () => {
      const email = emailEl.value.trim(), password = passwordEl.value;
      if (!email || !password) { showToast("Please enter your email and password.", "error"); return; }
      loginBtn.disabled = true; btnText.textContent = "Signing in…";
      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast("Login successful. Loading config…", "info");
        await loadGitHubToken();
        window.location.href = "list.html";
      } catch(err) {
        loginBtn.disabled = false; btnText.textContent = "Sign In";
        const map = {
          "auth/invalid-email":"Invalid email address.",
          "auth/user-not-found":"No account with this email.",
          "auth/wrong-password":"Incorrect password.",
          "auth/too-many-requests":"Too many attempts. Try later.",
          "auth/invalid-credential":"Invalid credentials.",
          "auth/network-request-failed":"Network error."
        };
        showToast(map[err.code] || err.message || "Login failed.", "error");
      }
    });
  </script>
</body>
</html>
