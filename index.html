<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Grocery Manager — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Toast Container ──────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ── Auth Page ────────────────────────────────────── -->
  <div class="auth-page">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">🛒</div>
        <h1>StoreDesk</h1>
        <p>Inventory &amp; Price Management</p>
      </div>

      <!-- Login Form -->
      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input
          type="email"
          id="emailInput"
          placeholder="admin@yourstore.com"
          autocomplete="email"
          inputmode="email"
        />
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input
          type="password"
          id="passwordInput"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button class="btn btn-primary" id="loginBtn" style="margin-top: 8px;">
        <span id="loginBtnText">Sign In</span>
      </button>

    </div>
  </div>

  <!-- ── Firebase & App Logic ─────────────────────────── -->
  <script type="module">
    import { auth, loadGitHubToken } from "./app.js";
    import { signInWithEmailAndPassword } from
      "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ── Toast helper ───────────────────────────────────
    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      const icons = { success: "✅", error: "❌", info: "ℹ️" };
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${icons[type] || "ℹ️"}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("dismissing");
        toast.addEventListener("animationend", () => toast.remove());
      }, 3500);
    }

    // ── Login handler ──────────────────────────────────
    const loginBtn  = document.getElementById("loginBtn");
    const btnText   = document.getElementById("loginBtnText");
    const emailEl   = document.getElementById("emailInput");
    const passwordEl = document.getElementById("passwordInput");

    // Allow Enter key on both fields
    [emailEl, passwordEl].forEach(el =>
      el.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); })
    );

    loginBtn.addEventListener("click", async () => {
      const email    = emailEl.value.trim();
      const password = passwordEl.value;

      // Basic validation
      if (!email || !password) {
        showToast("Please enter your email and password.", "error");
        return;
      }

      // Loading state
      loginBtn.disabled = true;
      btnText.textContent = "Signing in…";

      try {
        // 1. Authenticate with Firebase
        await signInWithEmailAndPassword(auth, email, password);

        // 2. Fetch GitHub token and store in sessionStorage
        showToast("Login successful. Loading config…", "info");
        await loadGitHubToken();

        // 3. Redirect to admin panel
        window.location.href = "admin.html";

      } catch (err) {
        loginBtn.disabled = false;
        btnText.textContent = "Sign In";

        // User-friendly error messages
        const errorMap = {
          "auth/invalid-email":         "Invalid email address format.",
          "auth/user-not-found":        "No account found with this email.",
          "auth/wrong-password":        "Incorrect password. Try again.",
          "auth/too-many-requests":     "Too many attempts. Try again later.",
          "auth/invalid-credential":    "Invalid credentials. Check and retry.",
          "auth/network-request-failed":"Network error. Check your connection."
        };
        const msg = errorMap[err.code] || err.message || "Login failed. Please try again.";
        showToast(msg, "error");
      }
    });
  </script>

</body>
</html>
